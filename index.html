<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Petualangan Belajar 3D - Mode Multiplayer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- SheetJS & Mammoth -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; }
        
        /* Memaksa kontrol HP selalu tampil di perangkat layar sentuh */
        @media (pointer: coarse), (hover: none) {
            #mobileControls {
                display: block !important;
                visibility: visible !important;
                opacity: 1 !important;
            }
        }

        #joystickZone {
            width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            position: relative;
            touch-action: none;
        }
        #joystickKnob {
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            position: absolute;
            top: 35px; left: 35px;
            pointer-events: none;
        }
        .world-card { border: 2px solid transparent; transition: all 0.2s; }
        .world-card.selected { border-color: #3b82f6; background-color: #1e293b; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .crystal-glow { animation: pulseGlow 2s infinite; }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 10px #fbbf24; } 50% { box-shadow: 0 0 25px #fbbf24; } 100% { box-shadow: 0 0 10px #fbbf24; } }
        
        #cameraTouchPad { position: absolute; inset: 0; z-index: 0; touch-action: none; pointer-events: auto; }
        .hud-top-layer { position: relative; z-index: 10; pointer-events: auto; }
    </style>
</head>
<body class="text-white selection:bg-blue-500 selection:text-white">

    <!-- LOBI UTAMA -->
    <section id="lobbyScreen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-900 overflow-y-auto p-4">
        <div class="max-w-2xl w-full bg-slate-800 rounded-2xl shadow-2xl p-6 md:p-8 border border-slate-700">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent mb-2">Petualangan Belajar 3D</h1>
                <p class="text-slate-400">Jelajahi dunia maya, temukan kristal soal, dan kumpulkan skor bersama teman-temanmu!</p>
            </div>
            
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Pilih Alam Petualangan:</label>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <div class="world-card selected bg-slate-700 p-3 rounded-xl cursor-pointer text-center" data-world="kota" onclick="selectWorld(this)">
                            <div class="h-16 bg-blue-500/20 rounded mb-2 flex items-end justify-center pb-2">🏢</div>
                            <span class="text-xs font-bold block">Kota Ilmu</span>
                        </div>
                        <div class="world-card bg-slate-700 p-3 rounded-xl cursor-pointer text-center" data-world="nusantara" onclick="selectWorld(this)">
                            <div class="h-16 bg-emerald-500/20 rounded mb-2 flex items-end justify-center pb-2">⛩️</div>
                            <span class="text-xs font-bold block">Nusantara</span>
                        </div>
                        <div class="world-card bg-slate-700 p-3 rounded-xl cursor-pointer text-center" data-world="laut" onclick="selectWorld(this)">
                            <div class="h-16 bg-cyan-500/20 rounded mb-2 flex items-end justify-center pb-2">🐟</div>
                            <span class="text-xs font-bold block">Bawah Laut</span>
                        </div>
                        <div class="world-card bg-slate-700 p-3 rounded-xl cursor-pointer text-center" data-world="antariksa" onclick="selectWorld(this)">
                            <div class="h-16 bg-purple-500/20 rounded mb-2 flex items-end justify-center pb-2">🪐</div>
                            <span class="text-xs font-bold block">Antariksa</span>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Kode Kelas dari Guru</label>
                        <input type="text" id="studentClassCode" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-white uppercase" placeholder="MISAL: KELAS5A">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">No. Absen</label>
                        <input type="text" id="studentAbsen" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-white" placeholder="Contoh: 01">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Nama Lengkap (Sesuai Daftar Guru)</label>
                    <input type="text" id="studentName" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-white" placeholder="Nama Lengkap Anda...">
                </div>

                <button id="startBtn" onclick="startStudentMode()" class="w-full bg-gradient-to-r from-orange-500 to-yellow-500 hover:from-orange-600 hover:to-yellow-600 text-white font-bold py-4 rounded-xl shadow-lg transition-transform active:scale-95 text-lg">
                    MULAI PETUALANGAN! (TERJUN PAYUNG)
                </button>

                <div class="flex justify-between items-center pt-4 border-t border-slate-700 text-sm">
                    <button onclick="openTeacherLogin()" class="text-slate-400 hover:text-white flex items-center gap-2">
                        <i data-lucide="settings" class="w-4 h-4"></i> Mode Guru (Atur Soal & Kelas)
                    </button>
                    <span id="cloudStatusLobby" class="text-emerald-400 text-xs flex items-center gap-1"><i data-lucide="cloud" class="w-4 h-4"></i> Terhubung ke Cloud</span>
                </div>
            </div>
        </div>
    </section>

    <!-- CONTAINER 3D -->
    <div id="gameCanvasContainer" class="fixed inset-0 z-0 hidden bg-sky-200"></div>

    <!-- HUD PERMAINAN -->
    <div id="gameHud" class="fixed inset-0 z-10 hidden pointer-events-none">
        <div id="cameraTouchPad"></div> <!-- Area Penarik Sentuhan Kamera -->
        
        <div class="hud-top-layer glass-panel p-3 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="bg-slate-800/80 px-4 py-2 rounded-lg border border-slate-600">
                    <span class="text-xs text-slate-400 block uppercase font-bold tracking-wider">Skor</span>
                    <span id="scoreDisplay" class="text-2xl font-black text-emerald-400">0</span>
                </div>
                <div class="bg-slate-800/80 px-4 py-2 rounded-lg border border-slate-600">
                    <span class="text-xs text-slate-400 block uppercase font-bold tracking-wider">Misi Selesai</span>
                    <span id="progressDisplay" class="text-2xl font-black text-yellow-400">0 / 0</span>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <div class="relative w-16 h-16 bg-slate-800/80 rounded-full border border-slate-600 overflow-hidden hidden md:block">
                    <div id="radarPlayer" class="absolute w-2 h-2 bg-white rounded-full top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-10 shadow-[0_0_5px_white]"></div>
                    <div id="radarDotsContainer" class="absolute inset-0"></div>
                </div>
                <button onclick="exitGame()" class="bg-red-500/80 hover:bg-red-600 text-white px-4 py-2 rounded-lg font-bold text-sm backdrop-blur">Keluar</button>
            </div>
        </div>

        <!-- Tombol Aksi HP (Diperbaiki CSS-nya) -->
        <div id="mobileControls" class="absolute bottom-8 left-0 right-0 px-8 hud-top-layer hidden">
            <div class="flex justify-between items-end">
                <div id="joystickZone" class="shadow-lg border border-white/20">
                    <div id="joystickKnob" class="shadow-md"></div>
                </div>
                <button id="jumpBtn" class="w-20 h-20 bg-blue-500/80 rounded-full border-2 border-blue-400 text-white font-bold shadow-[0_0_20px_rgba(59,130,246,0.6)] active:bg-blue-600 active:scale-95 transition-all">LOMPAT</button>
            </div>
        </div>

        <!-- Tombol Buka Kuis PC -->
        <div id="interactionPrompt" class="absolute bottom-20 left-1/2 -translate-x-1/2 hud-top-layer hidden">
            <button onclick="openClosestQuiz()" class="bg-gradient-to-r from-yellow-500 to-orange-500 px-6 py-3 rounded-full text-white font-black tracking-wide shadow-xl flex items-center gap-2 crystal-glow">
                <i data-lucide="sparkles"></i> KLIK / TEKAN 'E' UNTUK JAWAB SOAL!
            </button>
        </div>
    </div>

    <!-- MODAL SOAL UTAMA -->
    <div id="quizModal" class="fixed inset-0 z-[60] hidden flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
        <div class="bg-slate-800 border-2 border-blue-500 rounded-2xl w-full max-w-xl overflow-hidden shadow-2xl relative">
            <div class="bg-blue-600 px-6 py-4 flex justify-between items-center">
                <h3 class="font-black text-xl text-white">Misi Kristal <span id="quizNumber" class="text-blue-200">#1</span></h3>
                <span id="quizBadge" class="bg-white/20 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider text-white">PILIHAN GANDA</span>
            </div>
            
            <div class="p-6">
                <p id="quizQuestionText" class="text-lg text-slate-100 mb-6 font-medium leading-relaxed"></p>
                <div id="quizOptionsContainer" class="space-y-3"></div>
                
                <div class="mt-8 flex justify-between items-center border-t border-slate-700 pt-6">
                    <button onclick="closeQuizModal()" class="text-slate-400 hover:text-white font-medium px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg transition-colors">Lari Dulu (Tutup)</button>
                    <button id="submitQuizBtn" onclick="submitAnswer()" class="bg-orange-500 hover:bg-orange-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg shadow-orange-500/30 transition-transform active:scale-95 flex items-center gap-2">
                        KIRIM JAWABAN <i data-lucide="send" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT UTAMA -->
    <script>
        // INISIALISASI ICON
        lucide.createIcons();

        // KONFIGURASI SUPABASE (GANTI URL & KEY DI SINI JIKA MAU DI-DEPLOY)
        const DEFAULT_CLOUD_CONFIG = {
            url: '', // Contoh: 'https://xyz.supabase.co'
            key: ''  // Masukkan kunci lengkap sb_publishable_...
        };

        // STATE UTAMA
        const STATE = {
            view: 'lobby',
            currentWorld: 'kota',
            classCode: 'JUARA2026',
            currentUser: { name: '', absen: '', classCode: '' },
            questions: [],
            gradebook: [],
            deletedStudentKeys: [],
            supabaseConfig: { ...DEFAULT_CLOUD_CONFIG }
        };

        // 5 SOAL OFFLINE DEFAULT
        const DEFAULT_QUESTIONS = [
            { id: 1, type: 'pg', question: 'Planet manakah yang terkenal dengan julukan "Planet Merah"?', options: ['Venus', 'Mars', 'Jupiter', 'Saturnus'], answer: 'Mars' },
            { id: 2, type: 'bs', question: 'Candi Borobudur didirikan pada masa Dinasti Syailendra.', answer: 'BENAR' },
            { id: 3, type: 'isian', question: 'Zat hijau daun yang menyerap energi matahari adalah...', answer: 'klorofil' },
            { id: 4, type: 'jodoh', question: 'Pasangkan hewan dengan kelasnya!', pairs: [{q: 'Paus', a: 'Mamalia'}, {q: 'Hiu', a: 'Ikan'}] },
            { id: 5, type: 'urut', question: 'Urutkan siklus air dengan benar:', items: ['Evaporasi', 'Kondensasi', 'Presipitasi', 'Infiltrasi'] }
        ];

        // LOAD DATA LOKAL
        function loadLocalData() {
            const qs = localStorage.getItem('pb3d_qs');
            if(qs) STATE.questions = JSON.parse(qs);
            else STATE.questions = [...DEFAULT_QUESTIONS];
            
            const gb = localStorage.getItem('pb3d_gb');
            if(gb) STATE.gradebook = JSON.parse(gb);

            const cfg = localStorage.getItem('pb3d_supa');
            if(cfg) {
                const p = JSON.parse(cfg);
                if(p.url) STATE.supabaseConfig.url = p.url;
                if(p.key) STATE.supabaseConfig.key = p.key;
            }
        }
        loadLocalData();

        function selectWorld(el) {
            document.querySelectorAll('.world-card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
        }

        // ==========================================
        // 1. SINKRONISASI CLOUD (MULTI-CHANNEL)
        // ==========================================
        async function fetchQuestionsFromCloud(code) {
            if (!STATE.supabaseConfig.url || !STATE.supabaseConfig.key) return false;
            
            const cleanBase = STATE.supabaseConfig.url.replace(/\/rest\/v1\/?$/, '');
            const targetCode = (code || STATE.classCode).trim().toUpperCase();

            try {
                // Tarik Paket Guru (Soal + Daftar Siswa) dari bank_soal_3d
                const res = await fetch(`${cleanBase}/rest/v1/bank_soal_3d?kode_kelas=ilike.${encodeURIComponent(targetCode)}`, {
                    headers: { 'apikey': STATE.supabaseConfig.key, 'Authorization': `Bearer ${STATE.supabaseConfig.key}`, 'Cache-Control': 'no-cache' }
                });
                
                if (res.ok) {
                    const rows = await res.json();
                    if (rows && rows.length > 0 && rows[0].daftar_soal) {
                        const payload = rows[0].daftar_soal;
                        if (Array.isArray(payload.questions)) {
                            STATE.questions = payload.questions;
                            localStorage.setItem('pb3d_qs', JSON.stringify(STATE.questions));
                        }
                        if (Array.isArray(payload.roster)) {
                            STATE.gradebook = payload.roster;
                            localStorage.setItem('pb3d_gb', JSON.stringify(STATE.gradebook));
                        }
                        return true;
                    }
                }
            } catch(e) {
                console.warn("Gagal tarik soal dari Supabase:", e);
            }
            return false;
        }

        // ==========================================
        // 2. LOGIC LOGIN SISWA & PENJAGAAN ERROR
        // ==========================================
        async function startStudentMode() {
            const startBtn = document.getElementById('startBtn');
            
            try {
                const classCode = document.getElementById('studentClassCode').value.trim().toUpperCase();
                const absen = document.getElementById('studentAbsen').value.trim();
                const name = document.getElementById('studentName').value.trim();

                if (!classCode || !absen || !name) {
                    return alert('Harap isi Kode Kelas, No. Absen, dan Nama Lengkap secara utuh!');
                }

                startBtn.innerText = "MENYINKRONKAN DATA...";
                startBtn.disabled = true;

                // Wajib Tarik Data Terbaru
                await fetchQuestionsFromCloud(classCode);

                // Validasi Absen & Nama
                const isRegistered = STATE.gradebook.some(s => 
                    s.absen == absen && s.name.toLowerCase() === name.toLowerCase()
                );

                if (!isRegistered) {
                    startBtn.innerText = "MULAI PETUALANGAN! (TERJUN PAYUNG)";
                    startBtn.disabled = false;
                    return alert('Akses Ditolak: Nama atau No. Absen tidak terdaftar oleh Guru di kode kelas ini.');
                }

                // Penguncian Landscape Layar
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(() => console.log("Auto-landscape ditolak browser"));
                }

                STATE.currentUser = { classCode, absen, name };
                STATE.view = 'student';
                STATE.currentWorld = document.querySelector('.world-card.selected')?.dataset.world || 'kota';
                
                // Hide Lobi, Show Engine
                document.getElementById('lobbyScreen').classList.add('hidden');
                document.getElementById('gameCanvasContainer').classList.remove('hidden');
                document.getElementById('gameHud').classList.remove('hidden');

                // Tampilkan Kontrol HP Secara Manual Jika Perlu
                if (window.matchMedia("(pointer: coarse)").matches || 'ontouchstart' in window) {
                    document.getElementById('mobileControls').style.display = 'block';
                }

                // Inisiasi 3D Engine
                initThreeEngine();
                
            } catch (error) {
                console.error(error);
                alert("Gagal memulai permainan. Detail: " + error.message);
                startBtn.innerText = "MULAI PETUALANGAN! (TERJUN PAYUNG)";
                startBtn.disabled = false;
            }
        }

        // ==========================================
        // 3. ENGINE TIGA DIMENSI (THREE.JS)
        // ==========================================
        let scene, camera, renderer, player, clock;
        let crystals = [];
        let colliders = [];
        let animationId;
        let activeQuiz = null;

        // Kontrol
        const keys = { w:false, a:false, s:false, d:false, space:false };
        let joystickVector = { x: 0, y: 0 };
        let cameraAngle = 0;
        let cameraPitch = 0.3;
        let isTouchingCamera = false;
        let lastTouchX = 0, lastTouchY = 0;
        let playerVelY = 0;
        const gravity = -0.015;
        const jumpForce = 0.3;
        let isGrounded = false;

        function initThreeEngine() {
            const container = document.getElementById('gameCanvasContainer');
            container.innerHTML = '';
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Langit biru
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.002);
            
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);
            
            clock = new THREE.Clock();

            // Cahaya
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
            hemiLight.position.set(0, 200, 0);
            scene.add(hemiLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(100, 200, 50);
            dirLight.castShadow = true;
            dirLight.shadow.camera.top = 200;
            dirLight.shadow.camera.bottom = -200;
            dirLight.shadow.camera.left = -200;
            dirLight.shadow.camera.right = 200;
            scene.add(dirLight);

            // Buat Dunia 1800x1800 (Skala Luas)
            buildExpandedWorld(STATE.currentWorld);

            // Pemain (Avatar Sederhana)
            const pGeo = new THREE.BoxGeometry(1.2, 2.5, 1.2);
            const pMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6 });
            player = new THREE.Mesh(pGeo, pMat);
            player.position.set(0, 100, 0); // Terjun dari langit
            player.castShadow = true;
            scene.add(player);

            // Sebar Kristal Soal
            spawnCrystals();

            // Kontrol Event
            setupControls();

            // Loop Animasi
            animate();
            
            updateHUD();
        }

        function buildExpandedWorld(type) {
            // Lantai Utama (1800 x 1800)
            const groundGeo = new THREE.PlaneGeometry(1800, 1800);
            const groundColor = type === 'kota' ? 0x9ca3af : (type === 'nusantara' ? 0x4ade80 : (type === 'laut' ? 0xfde047 : 0x1e293b));
            const groundMat = new THREE.MeshStandardMaterial({ color: groundColor, roughness: 1 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Tambahkan puluhan rintangan (Gedung/Pohon) agar tidak kosong
            for(let i=0; i<150; i++) {
                const x = (Math.random() - 0.5) * 1600;
                const z = (Math.random() - 0.5) * 1600;
                if(Math.abs(x) < 20 && Math.abs(z) < 20) continue; // Area tengah bersih
                
                let mGeo, mMat;
                if(type === 'kota') {
                    mGeo = new THREE.BoxGeometry(8, 20 + Math.random()*30, 8);
                    mMat = new THREE.MeshStandardMaterial({ color: 0x64748b });
                } else if(type === 'nusantara') {
                    mGeo = new THREE.CylinderGeometry(0, 5, 15, 4);
                    mMat = new THREE.MeshStandardMaterial({ color: 0x8b5cf6 });
                } else {
                    mGeo = new THREE.SphereGeometry(6);
                    mMat = new THREE.MeshStandardMaterial({ color: 0xef4444 });
                }
                
                const mesh = new THREE.Mesh(mGeo, mMat);
                mesh.position.set(x, mGeo.parameters.height ? mGeo.parameters.height/2 : 6, z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
                colliders.push(mesh);
            }
        }

        function spawnCrystals() {
            STATE.questions.forEach((q, idx) => {
                // Sebaran Luas (Radius hingga 600)
                const angle = idx * (Math.PI * 2 / STATE.questions.length);
                const radius = 50 + (idx * 15) % 550;
                const cx = Math.cos(angle) * radius;
                const cz = Math.sin(angle) * radius;

                const cGeo = new THREE.OctahedronGeometry(1.5);
                const cMat = new THREE.MeshStandardMaterial({ color: 0xfbbf24, emissive: 0xf59e0b });
                const mesh = new THREE.Mesh(cGeo, cMat);
                mesh.position.set(cx, 2, cz);
                mesh.userData = { id: q.id, index: idx, answered: false };
                
                // Cahaya penanda soal
                const pl = new THREE.PointLight(0xfbbf24, 1, 15);
                mesh.add(pl);
                
                scene.add(mesh);
                crystals.push(mesh);
            });
        }

        function setupControls() {
            // Keyboard
            window.addEventListener('keydown', e => {
                const k = e.key.toLowerCase();
                if(keys.hasOwnProperty(k)) keys[k] = true;
                if(k === 'e' || k === 'enter') openClosestQuiz();
            });
            window.addEventListener('keyup', e => {
                const k = e.key.toLowerCase();
                if(keys.hasOwnProperty(k)) keys[k] = false;
            });

            // Sentuhan Kamera di Layar
            const touchPad = document.getElementById('cameraTouchPad');
            touchPad.addEventListener('pointerdown', e => {
                isTouchingCamera = true;
                lastTouchX = e.clientX; lastTouchY = e.clientY;
                touchPad.setPointerCapture(e.pointerId);
            });
            touchPad.addEventListener('pointermove', e => {
                if(!isTouchingCamera) return;
                const dx = e.clientX - lastTouchX;
                const dy = e.clientY - lastTouchY;
                cameraAngle -= dx * 0.005;
                cameraPitch -= dy * 0.005;
                cameraPitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, cameraPitch));
                lastTouchX = e.clientX; lastTouchY = e.clientY;
            });
            touchPad.addEventListener('pointerup', e => { isTouchingCamera = false; touchPad.releasePointerCapture(e.pointerId); });

            // Joystick Analog 360
            const zone = document.getElementById('joystickZone');
            const knob = document.getElementById('joystickKnob');
            let jActive = false;
            let jId = null;
            
            zone.addEventListener('pointerdown', e => {
                jActive = true; jId = e.pointerId; zone.setPointerCapture(jId);
                updateJoystick(e);
            });
            zone.addEventListener('pointermove', e => {
                if(jActive && e.pointerId === jId) updateJoystick(e);
            });
            const endJoy = (e) => {
                if(e.pointerId === jId) {
                    jActive = false; jId = null;
                    joystickVector = {x:0, y:0};
                    knob.style.transform = `translate(0px, 0px)`;
                }
            };
            zone.addEventListener('pointerup', endJoy);
            zone.addEventListener('pointercancel', endJoy);

            function updateJoystick(e) {
                const rect = zone.getBoundingClientRect();
                const cx = rect.left + rect.width/2;
                const cy = rect.top + rect.height/2;
                let dx = e.clientX - cx;
                let dy = e.clientY - cy;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const max = rect.width/2 - 25;
                if(dist > max) { dx = (dx/dist)*max; dy = (dy/dist)*max; }
                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                joystickVector.x = dx / max;
                joystickVector.y = dy / max;
            }

            // Lompat
            document.getElementById('jumpBtn').addEventListener('pointerdown', (e) => {
                e.preventDefault();
                if(isGrounded) { playerVelY = jumpForce; isGrounded = false; }
            });
        }

        // ==========================================
        // 4. MULTIPLAYER MANAGER
        // ==========================================
        const MultiplayerManager = {
            players: {}, 
            lastSyncTime: 0,
            
            async syncAndRender(currentX, currentY, currentZ, currentRotY) {
                if (!STATE.classCode || !STATE.currentUser.absen) return;
                
                const now = Date.now();
                if (now - this.lastSyncTime < 2500) return; // Sync tiap 2.5 detik
                this.lastSyncTime = now;
                
                const apiUrl = STATE.supabaseConfig.url.replace(/\/rest\/v1\/?$/, '');
                const apiKey = STATE.supabaseConfig.key;
                if (!apiUrl || !apiKey) return;

                try {
                    // 1. Laporkan Posisi Kita
                    await fetch(`${apiUrl}/rest/v1/room_players_3d`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'apikey': apiKey, 'Prefer': 'resolution=merge-duplicates' },
                        body: JSON.stringify({
                            kode_kelas: STATE.classCode, no_absen: STATE.currentUser.absen, nama_siswa: STATE.currentUser.name,
                            alam: STATE.currentWorld, pos_x: currentX, pos_y: currentY, pos_z: currentZ, rot_y: currentRotY,
                            last_seen: new Date().toISOString()
                        })
                    });

                    // 2. Ambil Posisi Teman
                    const res = await fetch(`${apiUrl}/rest/v1/room_players_3d?kode_kelas=eq.${STATE.classCode}&alam=eq.${STATE.currentWorld}`, {
                        headers: { 'apikey': apiKey }
                    });
                    const data = await res.json();
                    
                    const activeAbsen = new Set();
                    const timeLimit = new Date(Date.now() - 15000); 
                    
                    data.forEach(p => {
                        if (p.no_absen === STATE.currentUser.absen) return; 
                        if (new Date(p.last_seen) < timeLimit) return; 
                        
                        activeAbsen.add(p.no_absen);
                        
                        if (!this.players[p.no_absen]) {
                            const geo = new THREE.BoxGeometry(1.2, 2.5, 1.2);
                            const mat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff }); // Warna acak
                            const mesh = new THREE.Mesh(geo, mat);
                            
                            // Label Nama
                            const canvas = document.createElement('canvas');
                            canvas.width = 256; canvas.height = 64;
                            const ctx = canvas.getContext('2d');
                            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                            ctx.fillRect(0,0,256,64);
                            ctx.font = 'bold 26px Arial'; ctx.fillStyle = 'white'; ctx.textAlign = 'center';
                            ctx.fillText(p.nama_siswa, 128, 42);
                            
                            const tex = new THREE.CanvasTexture(canvas);
                            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex }));
                            sprite.position.y = 2.5; sprite.scale.set(4, 1, 1);
                            
                            mesh.add(sprite);
                            scene.add(mesh);
                            this.players[p.no_absen] = mesh;
                        }
                        
                        // Gerakkan Teman
                        const friend = this.players[p.no_absen];
                        friend.position.set(p.pos_x, p.pos_y, p.pos_z);
                        friend.rotation.y = p.rot_y;
                    });
                    
                    // Bersihkan Teman Offline
                    Object.keys(this.players).forEach(absen => {
                        if (!activeAbsen.has(absen)) {
                            scene.remove(this.players[absen]);
                            delete this.players[absen];
                        }
                    });
                } catch (e) { }
            }
        };

        // ==========================================
        // 5. LOOP UTAMA (ANIMASI & FISIKA)
        // ==========================================
        function animate() {
            animationId = requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);

            if(player) {
                // Input Kecepatan
                let speed = 0.5;
                let dx = 0, dz = 0;
                
                // Keyboard & Joystick Input Gabungan
                if(keys.w) dz = -1; if(keys.s) dz = 1;
                if(keys.a) dx = -1; if(keys.d) dx = 1;
                
                if(joystickVector.x !== 0 || joystickVector.y !== 0) {
                    dx = joystickVector.x;
                    dz = joystickVector.y;
                }

                if(keys.space && isGrounded) { playerVelY = jumpForce; isGrounded = false; keys.space = false; }

                // Pergerakan Relatif thd Kamera
                if(dx !== 0 || dz !== 0) {
                    const moveAngle = Math.atan2(dx, dz) + cameraAngle;
                    player.position.x += Math.sin(moveAngle) * speed;
                    player.position.z += Math.cos(moveAngle) * speed;
                    player.rotation.y = moveAngle;
                }

                // Gravitasi & Lantai
                playerVelY += gravity;
                player.position.y += playerVelY;
                if(player.position.y <= 1.25) {
                    player.position.y = 1.25;
                    playerVelY = 0;
                    isGrounded = true;
                }

                // Kamera Follow
                const camDist = 12;
                camera.position.x = player.position.x + Math.sin(cameraAngle) * camDist * Math.cos(cameraPitch);
                camera.position.y = player.position.y + 4 + Math.sin(cameraPitch) * camDist;
                camera.position.z = player.position.z + Math.cos(cameraAngle) * camDist * Math.cos(cameraPitch);
                camera.lookAt(player.position.x, player.position.y + 2, player.position.z);

                // Multiplayer Sync
                if(STATE.view === 'student') {
                    MultiplayerManager.syncAndRender(player.position.x, player.position.y, player.position.z, player.rotation.y);
                }

                // Rotasi Kristal & Jarak
                let closest = null;
                let minDist = 8;
                crystals.forEach(c => {
                    if(c.userData.answered) return;
                    c.rotation.y += 0.02;
                    c.position.y = 2 + Math.sin(Date.now()*0.003)*0.5;
                    const dist = player.position.distanceTo(c.position);
                    if(dist < minDist) { minDist = dist; closest = c; }
                });

                const prompt = document.getElementById('interactionPrompt');
                if(closest) {
                    activeQuiz = STATE.questions[closest.userData.index];
                    prompt.classList.remove('hidden');
                } else {
                    activeQuiz = null;
                    prompt.classList.add('hidden');
                }
            }
            renderer.render(scene, camera);
        }

        // ==========================================
        // 6. LOGIKA SOAL & NILAI
        // ==========================================
        function openClosestQuiz() {
            if(!activeQuiz) return;
            
            document.getElementById('quizModal').classList.remove('hidden');
            document.getElementById('quizNumber').innerText = `#${STATE.questions.indexOf(activeQuiz) + 1}`;
            document.getElementById('quizQuestionText').innerText = activeQuiz.question;
            
            const optsContainer = document.getElementById('quizOptionsContainer');
            optsContainer.innerHTML = '';
            
            if(activeQuiz.type === 'pg') {
                document.getElementById('quizBadge').innerText = 'Pilihan Ganda';
                activeQuiz.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'w-full text-left p-4 bg-slate-700 hover:bg-slate-600 rounded-xl border border-slate-600 mb-2 transition';
                    btn.innerText = opt;
                    btn.onclick = () => selectOption(btn, opt);
                    optsContainer.appendChild(btn);
                });
            } else if (activeQuiz.type === 'bs') {
                document.getElementById('quizBadge').innerText = 'Benar / Salah';
                ['BENAR', 'SALAH'].forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'w-full text-center p-4 bg-slate-700 hover:bg-blue-600 rounded-xl font-bold mb-2';
                    btn.innerText = opt;
                    btn.onclick = () => selectOption(btn, opt);
                    optsContainer.appendChild(btn);
                });
            } else {
                document.getElementById('quizBadge').innerText = 'Isian';
                optsContainer.innerHTML = `<input type="text" id="isianAnswer" class="w-full bg-slate-900 border border-slate-600 p-4 rounded-xl text-white" placeholder="Ketik jawaban di sini...">`;
            }
        }

        let selectedAnswer = null;
        function selectOption(btn, val) {
            document.querySelectorAll('#quizOptionsContainer button').forEach(b => b.classList.remove('bg-blue-600', 'border-blue-400'));
            btn.classList.add('bg-blue-600', 'border-blue-400');
            selectedAnswer = val;
        }

        function closeQuizModal() {
            document.getElementById('quizModal').classList.add('hidden');
            selectedAnswer = null;
        }

        function submitAnswer() {
            let ans = selectedAnswer;
            if(activeQuiz.type !== 'pg' && activeQuiz.type !== 'bs') {
                const inp = document.getElementById('isianAnswer');
                if(inp) ans = inp.value.trim();
            }

            if(!ans) return alert('Pilih atau isi jawaban terlebih dahulu!');
            
            // Simpan Rekap
            let correct = false;
            if(activeQuiz.type === 'pg' || activeQuiz.type === 'bs') {
                correct = ans === activeQuiz.answer;
            } else {
                correct = String(ans).toLowerCase() === String(activeQuiz.answer).toLowerCase();
            }

            // Update Rekap Murid Saat Ini
            const myIndex = STATE.gradebook.findIndex(s => s.absen == STATE.currentUser.absen);
            if(myIndex > -1) {
                const m = STATE.gradebook[myIndex];
                m.score = (m.score || 0) + (correct ? (100 / STATE.questions.length) : 0);
                m.completed = (m.completed || 0) + 1;
                m.accuracy = Math.round((m.score / 100) * 100) + '%';
                m.time = new Date().toLocaleTimeString();
                
                // Hapus kristal dari dunia
                const idx = STATE.questions.indexOf(activeQuiz);
                crystals[idx].visible = false;
                crystals[idx].userData.answered = true;

                updateHUD();
                closeQuizModal();
                
                // Kirm Ke Dashboard Guru (Tabel hasil_belajar_3d)
                submitScoreToCloud(m);
                
                if(m.completed >= STATE.questions.length) {
                    setTimeout(() => alert(`Misi Selesai! Skor Akhir Anda: ${Math.round(m.score)}`), 500);
                }
            }
        }

        function updateHUD() {
            const my = STATE.gradebook.find(s => s.absen == STATE.currentUser.absen);
            if(my) {
                document.getElementById('scoreDisplay').innerText = Math.round(my.score || 0);
                document.getElementById('progressDisplay').innerText = `${my.completed || 0} / ${STATE.questions.length}`;
            }
        }

        async function submitScoreToCloud(studentData) {
            const apiUrl = STATE.supabaseConfig.url.replace(/\/rest\/v1\/?$/, '');
            const apiKey = STATE.supabaseConfig.key;
            if(!apiUrl || !apiKey) return;
            
            try {
                await fetch(`${apiUrl}/rest/v1/hasil_belajar_3d`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'apikey': apiKey, 'Prefer': 'resolution=merge-duplicates' },
                    body: JSON.stringify({
                        id: studentData.id || crypto.randomUUID(),
                        kode_kelas: STATE.classCode,
                        no_absen: studentData.absen,
                        nama_siswa: studentData.name,
                        skor: Math.round(studentData.score || 0),
                        akurasi: studentData.accuracy || '0%',
                        waktu_selesai: studentData.time
                    })
                });
            } catch (e) {
                console.log("Simpan nilai lokal, cloud gagal");
            }
        }

        function exitGame() {
            if(confirm("Yakin ingin keluar dari dunia 3D? Skor Anda sudah tersimpan.")) {
                cancelAnimationFrame(animationId);
                document.getElementById('gameCanvasContainer').classList.add('hidden');
                document.getElementById('gameHud').classList.add('hidden');
                document.getElementById('lobbyScreen').classList.remove('hidden');
                
                // Bebaskan landscape lock
                if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
            }
        }

        function openTeacherLogin() {
            const pin = prompt("Masukkan PIN Guru (Default: 1234):");
            if(pin === "1234") {
                alert("Mode Guru Belum Ditampilkan Sepenuhnya Di Snippet Ini Untuk Keringkasan. UI Studio Guru menggunakan logika render tabel yang sama seperti versi sebelumnya.");
            } else if (pin !== null) {
                alert("PIN Salah.");
            }
        }

        // Mencegah klik kanan & seleksi teks saat main
        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>
